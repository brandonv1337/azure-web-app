{% extends "base.html" %}

{% block title %}My Games{% endblock %}

{% block content %}
  <h1>My Games ({{ games | length }})</h1>
  <div class="row g-3">
    {% for game in games %}
      <div class="col-12 col-md-6 col-lg-4">
        <div class="card h-100">
          <div class="card-body">
            <h5 class="card-title">{{ loop.index }}. {{ game.title }}</h5>
            <p class="card-text">{{ game.why }}</p>
            <a class="btn btn-primary"
               href="{{ url_for('game_detail', game_id=game.id) }}">Read more</a>
          </div>
        </div>
      </div>
    {% else %}
      <p>No games yet!</p>
    {% endfor %}
  </div>
{% endblock %}
